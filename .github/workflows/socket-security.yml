# Socket Security GitHub Actions Workflow
# Runs Socket Security scans on every commit/PR to catch supply-chain
# issues (malicious packages, typosquats, install-script abuse, etc.)
# before they merge.
#
# Setup required before this workflow will run successfully:
#   1. Create a Socket.dev account and generate an API key
#   2. Add it as a repository (or org) secret named SOCKET_SECURITY_API_KEY
# Until then, this workflow will fail at the "Run Socket Security Scan" step.

name: socket-security-workflow
run-name: Socket Security Github Action

on:
  push:
    branches: ['**']  # Run on all branches, all commits
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

# Prevent concurrent runs for the same commit
concurrency:
  group: socket-scan-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  socket-security:
    permissions:
      issues: write
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # For PRs, fetch one additional commit for proper diff analysis
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Socket CLI
        shell: bash
        run: |
          set -euo pipefail
          socket_version="2.6.6"
          socket_wheel_sha256="a3fb66b94b2c07fb26a0af867b25410c846aec90c5d50dfd55f246b7f115da76"
          wheel_dir="${RUNNER_TEMP}/socket-wheels"
          python -m pip download \
            --only-binary=:all: \
            --dest "$wheel_dir" \
            "socketsecurity==${socket_version}"
          socket_wheel="${wheel_dir}/socketsecurity-${socket_version}-py3-none-any.whl"
          echo "${socket_wheel_sha256}  ${socket_wheel}" | sha256sum --check
          python -m pip install --no-index --find-links "$wheel_dir" "socketsecurity==${socket_version}"
          python -m pip check

      - name: Run Socket Security Scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Determine PR number based on event type
          PR_NUMBER=0
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            PR_NUMBER=${{ github.event.pull_request.number }}
          elif [ "${{ github.event_name }}" == "issue_comment" ]; then
            PR_NUMBER=${{ github.event.issue.number }}
          fi

          socketcli \
            --target-path $GITHUB_WORKSPACE \
            --scm github \
            --pr-number $PR_NUMBER
