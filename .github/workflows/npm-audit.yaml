name: NPM Audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate GitHub workflows
        uses: reviewdog/action-actionlint@dbe5299849118fd6f099ba563d263d770955a64a # v1.73.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-check
          fail_level: error


      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: package.json
          cache: npm

      - name: Pin npm policy toolchain
        run: npm install --global npm@11.19.0 --ignore-scripts

      - name: Verify npm security policy
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm config get min-release-age)" = "3"
          test "$(npm config get ignore-scripts)" = "true"
          test "$(npm config get allow-git)" = "none"
          test "$(npm config get allow-remote)" = "none"
          test "$(npm config get allow-file)" = "none"
          test "$(npm config get allow-directory)" = "none"
          test "$(npm config get strict-peer-deps)" = "true"
          test "$(npm config get engine-strict)" = "true"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit known vulnerabilities
        run: npm audit --audit-level=moderate

      - name: Verify registry signatures and attestations
        run: npm audit signatures
