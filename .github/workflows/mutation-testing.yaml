name: Mutation Testing

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
jobs:
  mutation:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: package.json
          cache: npm

      - name: Pin npm policy toolchain
        run: npm install --global npm@11.19.0 --ignore-scripts

      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Restore Stryker incremental report
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ runner.os }}-${{ hashFiles('package-lock.json', 'stryker.config.mjs', 'vitest.config.ts', 'tsconfig.json', 'tsconfig.build.json') }}-main

      - name: Run changed mutation thresholds (pull request)
        if: github.event_name == 'pull_request'
        run: npm run test:mutation:changed -- --base "${{ github.event.pull_request.base.sha }}"

      - name: Run full mutation thresholds (main)
        if: github.event_name != 'pull_request'
        run: npm run test:mutation
      - name: Save Stryker incremental report
        if: github.event_name != 'pull_request' && success()
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ runner.os }}-${{ hashFiles('package-lock.json', 'stryker.config.mjs', 'vitest.config.ts', 'tsconfig.json', 'tsconfig.build.json') }}-main

      - name: Upload mutation report
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: mutation-report
          path: reports/mutation/
          overwrite: true
